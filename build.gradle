plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.0.15'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'net.serenity-bdd:serenity-core:4.0.15'
    testImplementation 'net.serenity-bdd:serenity-cucumber:4.0.15'
    testImplementation 'net.serenity-bdd:serenity-rest-assured:4.0.15'
    testImplementation 'net.serenity-bdd:serenity-screenplay:4.0.15'
    testImplementation 'net.serenity-bdd:serenity-screenplay-webdriver:4.0.15'
    testImplementation 'net.serenity-bdd:serenity-screenplay-rest:4.0.15'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.slf4j:slf4j-simple:2.0.7'
}

test {
    systemProperty "cucumber.filter.tags", System.getProperty("cucumber.filter.tags")
    testLogging.showStandardStreams = true
}

gradle.startParameter.continueOnFailure = true