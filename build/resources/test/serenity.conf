webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    "goog:chromeOptions" {
      args = [ "--start-maximized", "--test-type", "--no-sandbox", "--lang=es", "--disable-popup-blocking", "--disable-download-notification", "--ignore-certificate-errors", "--allow-running-insecure-content", "--disable-translate", "--always-authorize-plugins", "--disable-extensions","--remote-allow-origins=*" ]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
    restapi.base.url = "https://reqres.in/api"
  }
}

serenity {
  project.name = "Prueba Tecnica Makers QA - Serenity BDD"
  test.root = "com.makers.qa"
  tag.failures = "true"
  restart.browser.for.each = scenario
}

# Configurar variable contraseña
credentials {
  standard_user {
    username = "standard_user"
    password = ${?VAULT_SAUCEDEMO_PASSWORD}
  }
  locked_out_user {
    username = "locked_out_user"
    password = ${?VAULT_SAUCEDEMO_PASSWORD}
  }
}

webdriver {
  capabilities {
    "goog:chromeOptions" {
      args = [
        "start-maximized", "test-type", "no-sandbox", "lang=es",
        "disable-popup-blocking", "disable-download-notification",
        "ignore-certificate-errors", "allow-running-insecure-content",
        "disable-translate", "always-authorize-plugins", "disable-extensions",
        "disable-search-engine-choice-screen"
      ]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
      }
    }
  }
}

serenity {
  # Opciones: FOR_EACH_ACTION, BEFORE_AND_AFTER_EACH_STEP, AFTER_EACH_STEP, FOR_FAILURES
  take.screenshots = FOR_EACH_ACTION

  # Mantiene el reporte limpio y organizado
  test.root = "com.makers.qa"

  # Opcional: comprime las imágenes para que el reporte no pese demasiado
  compress.filenames = true
}

