webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    "goog:chromeOptions" {
      args = [ "--start-maximized", "--test-type", "--no-sandbox", "--lang=es", "--disable-popup-blocking", "--disable-download-notification", "--ignore-certificate-errors", "--allow-running-insecure-content", "--disable-translate", "--always-authorize-plugins", "--disable-extensions","--remote-allow-origins=*" ]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
    restapi.base.url = "https://reqres.in/api"
  }
}

serenity {
  project.name = "Prueba Tecnica Makers QA - Serenity BDD"
  test.root = "com.makers.qa"
  tag.failures = "true"
  restart.browser.for.each = scenario
}